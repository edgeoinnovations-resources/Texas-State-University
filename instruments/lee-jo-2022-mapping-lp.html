<script>window.STUDY = {"sections": [{"h": "Three ways to identify a learning progression", "nav": "Three approaches", "src": "paper", "type": "cards", "open": true, "lead": "A learning progression has to say what students know and can do at each level. The chapter compares three ways of finding that out.", "items": [{"t": "Data-grounded", "d": "Synthesise literature, curriculum frameworks and expert insight into statements of learning at each stage. Simple, but needs later validation: it cannot confirm that today's students follow the stages."}, {"t": "In situ student understanding", "d": "Start the same way, then validate with assessments, clinical interviews and teaching episodes. The most common approach in science education. It describes typical students in a context but does not account for teaching strategy or instructor."}, {"t": "Instructional intervention", "d": "Design instruction and assessment from a hypothesised progression, teach it, and refine the progression from students' results over time."}]}, {"h": "The method, step by step", "nav": "Method", "src": "paper", "type": "cards", "open": true, "items": [{"t": "Choose the construct", "d": "Six map elements were selected after analysing 21 studies of students' learning about map concepts and spatial skills."}, {"t": "Hypothesise the levels", "d": "Four levels, from the most basic (Level 1, around grade 3, age 8) to sophisticated (Level 4, around grade 12, age 17)."}, {"t": "Write ordered multiple-choice items", "d": "Each answer choice corresponds to a level, so a response shows where a student sits. A student at a higher level is expected to select the lower-level choices as well."}, {"t": "Pilot, then test at scale", "d": "A pilot with 39 middle-school and 41 high-school students checked item fit. The main test then went to 1,486 students across five grade bands."}, {"t": "Fit a measurement model", "d": "The coded responses were analysed with the partial credit Rasch model, and the results read against the hypothesised progression."}]}, {"h": "The hypothesised progression", "nav": "The progression", "src": "paper", "type": "table", "lead": "What a student is expected to do with each map element at each level, before testing. Level 1 is anchored around grade 3 and Level 4 around grade 12.", "head": ["Map element", "Level 1", "Level 2", "Level 3", "Level 4"], "rows": [["Contour lines", "Infer elevation from colours", "Read heights from contours and estimate between them", "Calculate the average gradient between two points", "Identify valleys, hills and ridges from contour patterns"], ["Distance", "Judge relative distance (A is closer than B); measure a straight line between two points", "Measure winding distances", "Understand that relief changes distance over a surface", "—"], ["Location", "Describe relative location: behind, in front of, to the left of", "Express locations using landmarks", "Give locations with latitude and longitude", "Understand the effect of a difference in location between points"], ["Orientation", "Follow left, right and forwards; treat the top of a map as north", "Plot the four cardinal directions", "Plot the eight points of the compass", "—"], ["Map projection", "Accept only Mercator-style maps as accurate", "Understand that a world map can be drawn in many ways, chosen by purpose", "Understand that every projection distorts, to varying degrees", "Understand the characteristics of common projections"], ["Scale", "—", "Understand large-scale and small-scale maps", "Use a scale bar for straight-line and winding distances", "Calculate approximate areas from map distances"]], "note": "Condensed from the chapter's Table 3.2, which credits Lee (2017). The printed table lists descriptors and element labels in separate columns; the assignment of each descriptor to an element here follows its content. Check the chapter before quoting a cell."}, {"h": "How an item reveals a level", "nav": "An example item", "src": "paper", "type": "prose", "paras": ["The chapter shows one ordered multiple-choice item on map projection. Students see a table of countries by area and two world maps, and select every statement they think is right. The statements range from treating one map as the only accurate map with no distortion, through recognising that both maps distort some property, to judging which map suits comparing the sizes of countries. Each statement belongs to a level, so the set a student selects places them on the progression."]}, {"h": "Who was tested", "nav": "Sample", "src": "paper", "type": "bars", "title": "Students by grade", "dec": 0, "rows": [["Grade 3", 359], ["Grade 5", 168], ["Grade 7", 349], ["Grade 10", 347], ["Tertiary", 263]]}, {"h": "Plan a progression for your own concept", "nav": "Plan yours", "src": "site", "tool": true, "type": "planner", "lead": "The same five steps, for any geographic concept or skill.", "items": [{"t": "Which concept or skill, and why does it need a progression?", "d": "", "ph": "e.g. overlay reasoning; region; scale"}, {"t": "Which approach will you take, and what does it cost you?", "d": "Data-grounded, in situ, or instructional intervention.", "ph": ""}, {"t": "Draft your lowest and highest levels.", "d": "The anchors. What does a novice do, and what does an expert do?", "ph": ""}, {"t": "How will each item reveal a level?", "d": "Ordered multiple choice, interview, performance task…", "ph": ""}, {"t": "Who can you test, across which grades?", "d": "This study spanned grade 3 to university.", "ph": ""}, {"t": "How will you check the levels are real?", "d": "The chapter used a partial credit Rasch model.", "ph": ""}]}, {"h": "Questions for your own research", "nav": "Your research", "src": "site", "type": "list", "items": ["Jo's own four-level GeoProgressions structure also runs from grade 3 to grade 12. How do the levels here line up with the frameworks you are comparing?", "The in situ approach ignores teaching. If instruction changes the order in which students learn map concepts, which approach would detect it?", "The sample is Korean. What would have to be re-established before using the test with students in another curriculum?"]}]};</script>
