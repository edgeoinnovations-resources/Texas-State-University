ic knowledge, skills and practices.", "Teach spatial concepts explicitly, before or during a spatially rich curriculum."]}, {"h": "Four recommendations for research", "nav": "Recommendations", "src": "paper", "type": "cards", "open": true, "items": [{"t": "Understand geospatial thinking", "d": "Study the particular kind of spatial thinking that involves geographic space and inquiry. Effects appear only when specific skills are aligned with disciplinary knowledge and practices."}, {"t": "Build valid, reliable assessment", "d": "A coordinated effort to develop tasks and items for different types of geospatial thinking, so that new curricula can be judged by student outcomes."}, {"t": "Make strategies usable by teachers", "d": "Many studies tested a strategy once, taught by the researcher. Report enough detail for adaptation, and use teachers' action research to build evidence across contexts."}, {"t": "Bring teacher education in", "d": "Research on curriculum, instruction and assessment should take the teacher's role into account."}]}, {"h": "Position your study", "nav": "Position your study", "src": "site", "tool": true, "type": "planner", "items": [{"t": "Which part of the framework does your study sit in?", "d": "Curriculum, instruction, assessment, teacher knowledge, PCK or dispositions. It may span two.", "ph": ""}, {"t": "Which recommendation does it answer?", "d": "", "ph": ""}, {"t": "What has been published since February 2018 that the review could not include?", "d": "List what you need to read.", "ph": ""}, {"t": "State your gap in one sentence.", "d": "", "ph": ""}]}, {"h": "Questions for your own research", "nav": "Your research", "src": "site", "type": "list", "items": ["The review deliberately set teacher education aside. Does your study belong on the side it covered or the side it left out?", "Recommendation two asks for coordinated assessment work. Which instruments on this site already answer it, and for which skills?"]}]};</script>
